name: Production health + keep-alive

# Supabase's free plan pauses a project after ~7 days without activity, which
# takes login and every data screen down. This runs daily: it exercises the
# database (via the API's readiness check) and Supabase Auth, so the project
# stays active, and it fails loudly (GitHub emails the repo owner) if
# production is down or already paused.

on:
  schedule:
    - cron: "17 13 * * *" # daily, 13:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    name: Ping production
    runs-on: ubuntu-latest
    env:
      API_URL: https://api-production-c6141.up.railway.app
      WEB_URL: https://web-production-e916f.up.railway.app
      SUPABASE_URL: https://${{ vars.SUPABASE_PROJECT_REF }}.supabase.co
    steps:
      - name: API + database readiness
        run: curl --fail-with-body --silent --show-error --retry 3 --retry-delay 20 --retry-all-errors "$API_URL/health/ready"
      - name: Supabase Auth health
        env:
          # Publishable key: public by design (it's in the web app bundle).
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: curl --fail --silent --show-error --retry 3 --retry-delay 20 --retry-all-errors -o /dev/null -H "apikey: $SUPABASE_PUBLISHABLE_KEY" "$SUPABASE_URL/auth/v1/health"
      - name: Website
        run: curl --fail --silent --show-error --retry 3 --retry-delay 20 --retry-all-errors -o /dev/null "$WEB_URL/healthz"
